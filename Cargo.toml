[package]
name = "gamerec"
version = "2.0.1"
edition = "2021"
rust-version = "1.92"
description = "Gravador de tela para gameplays (Windows)"
license = "MIT"
publish = false

[[bin]]
name = "GameRec"
path = "src/main.rs"

[dependencies]
egui = { version = "0.34.3", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.34.3", default-features = false, features = ["clipboard", "links"] }
egui_software_backend = { version = "0.0.3", default-features = false, features = ["std"] }
bytemuck = "1.23"
softbuffer = "0.4.8"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
cpal = "0.15.3"
hound = "3.5.1"
image = { version = "0.25.6", default-features = false, features = ["png"] }
rfd = { version = "0.15.3", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.19"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
