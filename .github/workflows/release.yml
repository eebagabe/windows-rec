name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version
        run: |
          $ver = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$ver") {
            throw "Tag $env:GITHUB_REF_NAME nao bate com a versao do Directory.Build.props ($ver)"
          }
          "APP_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        run: dotnet publish src/WinRec -c Release -o publish

      - name: Download FFmpeg
        run: ./scripts/get-ffmpeg.ps1 -Token "${{ github.token }}"

      - name: Install Inno Setup
        run: |
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile is.exe
          Start-Process ./is.exe -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/PORTABLE=1", "/DIR=$env:RUNNER_TEMP\inno"

      - name: Build installer
        run: |
          ./installer/make-images.ps1
          & "$env:RUNNER_TEMP\inno\ISCC.exe" /Q "/DAppVersion=$env:APP_VERSION" installer\WinRec.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: WinRec
          path: |
            publish/WinRec.exe
            dist/WinRec-Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            **Instalar:** baixe o `WinRec-Setup.exe` abaixo e siga o assistente.
          files: |
            dist/WinRec-Setup.exe
            publish/WinRec.exe
